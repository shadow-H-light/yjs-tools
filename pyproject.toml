[project]
name = "yjs-tools"
version = "0.1.0"
description = "本机研究生工具集。首个模块：选刊神器。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
xuankan = "yjs_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yjs_tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/yjs_tools/db/schema.sql" = "yjs_tools/db/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
